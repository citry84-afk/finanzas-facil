# Las reglas de rutas se mantienen en public/_redirects, donde su orden es significativo.
# No añadir aquí un catch-all: haría que páginas .html inexistentes devolvieran la portada
# con estado 200 y Google las interpretara como soft-404.

# Headers para optimización de performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.{jpg,jpeg,png,gif,webp,svg,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
