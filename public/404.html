<html lang="es">
<head>

      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

    main {
      max-width: 620px;

    h1 { margin: 0 0 12px; font-size: 32px; }
    p { color: #4b5563; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      color: #fff;
      background: #2563eb;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Página no encontrada</h1>
